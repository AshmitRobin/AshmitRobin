<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="35%" cy="30%" r="85%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="70"/></clipPath>
  </defs>

  <!-- twinkling stars -->
  <g fill="#fff">
    <circle cx="30" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="60" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="250" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="245" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="15" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="288" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glow -->
  <circle cx="150" cy="150" r="105" fill="url(#glow)"/>

  <!-- back half of orbit -->
  <g transform="rotate(-20 150 150)">
    <ellipse cx="150" cy="150" rx="120" ry="38" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- planet -->
  <circle cx="150" cy="150" r="70" fill="url(#planet)"/>
  <g clip-path="url(#clip)">
    <g fill="#4ade80" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-140 0" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="108" cy="128" rx="22" ry="13"/>
      <ellipse cx="172" cy="178" rx="26" ry="12"/>
      <ellipse cx="200" cy="120" rx="14" ry="10"/>
      <ellipse cx="248" cy="128" rx="22" ry="13"/>
      <ellipse cx="312" cy="178" rx="26" ry="12"/>
      <ellipse cx="340" cy="120" rx="14" ry="10"/>
    </g>
    <circle cx="150" cy="150" r="70" fill="url(#shade)"/>
  </g>

  <!-- satellite orbit (front) -->
  <g transform="rotate(-20 150 150)">
    <circle r="7" fill="#f472b6">
      <animateMotion dur="7s" repeatCount="indefinite" path="M30,150 a120,38 0 1,0 240,0 a120,38 0 1,0 -240,0"/>
    </circle>
    <circle r="3" fill="#fff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M30,150 a120,38 0 1,0 240,0 a120,38 0 1,0 -240,0"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
